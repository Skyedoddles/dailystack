<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo + Timer Widget</title>
<style>
  :root {
    --pink: #ffb6c1;
    --pink-dark: #ff8fab;
    --pink-deep: #ff6f9c;
    --baby-blue: #a7d8f0;
    --baby-blue-dark: #7ec4e8;
    --blue-deep: #4fb0e0;
    --bg: #fff5f8;
    --card: #ffffff;
    --text: #4a3b45;
    --text-soft: #8a7a85;
    --border: #f3d9e2;
    --done: #c9c0c6;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, var(--baby-blue) 0%, var(--pink) 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .widget {
    width: 100%;
    max-width: 680px;
    background: var(--bg);
    border-radius: 28px;
    box-shadow: 0 20px 50px rgba(255, 143, 171, 0.35);
    display: flex;
    overflow: hidden;
    border: 3px solid #fff;
  }

  @media (max-width: 560px) {
    .widget { flex-direction: column; }
  }

  /* ---------- Timer side panel ---------- */
  .timer-panel {
    background: linear-gradient(180deg, var(--baby-blue) 0%, var(--baby-blue-dark) 100%);
    width: 220px;
    flex-shrink: 0;
    padding: 28px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #234;
  }

  @media (max-width: 560px) {
    .timer-panel { width: 100%; }
  }

  .timer-panel h2 {
    font-size: 15px;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin: 0 0 18px;
    color: #2c5570;
    font-weight: 700;
  }

  .timer-ring {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 18px rgba(79, 176, 224, 0.35);
    position: relative;
    margin-bottom: 18px;
  }

  .timer-ring svg { position: absolute; top: 0; left: 0; transform: rotate(-90deg); }

  .timer-display {
    font-size: 28px;
    font-weight: 700;
    color: var(--pink-deep);
    z-index: 1;
    font-variant-numeric: tabular-nums;
  }

  .timer-controls {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }

  .timer-controls button {
    border: none;
    border-radius: 12px;
    padding: 9px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    background: #fff;
    color: var(--blue-deep);
    box-shadow: 0 3px 8px rgba(0,0,0,0.08);
    transition: transform 0.15s ease, background 0.15s ease;
  }

  .timer-controls button:hover { transform: translateY(-1px); }

  .timer-controls button.primary {
    background: var(--pink-deep);
    color: #fff;
  }

  .timer-presets {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .timer-presets button {
    border: 1px solid rgba(255,255,255,0.6);
    background: rgba(255,255,255,0.35);
    color: #234;
    border-radius: 10px;
    padding: 5px 9px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
  }

  .timer-presets button.active {
    background: #fff;
    color: var(--blue-deep);
  }

  /* ---------- Todo main panel ---------- */
  .todo-panel {
    flex: 1;
    padding: 28px 26px;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .todo-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 4px;
  }

  .todo-header h1 {
    font-size: 20px;
    margin: 0;
    color: var(--pink-deep);
    font-weight: 800;
  }

  .todo-count {
    font-size: 12px;
    color: var(--text-soft);
    background: var(--pink);
    padding: 3px 10px;
    border-radius: 999px;
    color: #fff;
    font-weight: 700;
  }

  .todo-sub {
    font-size: 12px;
    color: var(--text-soft);
    margin-bottom: 18px;
  }

  .add-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  .add-row input {
    flex: 1;
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 14px;
    outline: none;
    background: #fff;
    color: var(--text);
  }

  .add-row input:focus { border-color: var(--baby-blue-dark); }

  .add-row button {
    border: none;
    background: var(--pink-deep);
    color: #fff;
    border-radius: 12px;
    padding: 0 18px;
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    line-height: 1;
  }

  .add-row button:hover { background: var(--blue-deep); }

  .todo-list {
    list-style: none;
    margin: 0;
    padding: 0;
    overflow-y: auto;
    max-height: 340px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .todo-list::-webkit-scrollbar { width: 6px; }
  .todo-list::-webkit-scrollbar-thumb { background: var(--pink); border-radius: 4px; }

  .todo-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px 12px;
  }

  .todo-item.done {
    background: #fbf1f4;
  }

  .checkbox {
    width: 22px;
    height: 22px;
    border-radius: 7px;
    border: 2px solid var(--baby-blue-dark);
    flex-shrink: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .checkbox.checked {
    background: var(--pink-deep);
    border-color: var(--pink-deep);
  }

  .checkbox.checked::after {
    content: "✓";
    color: #fff;
    font-size: 14px;
    font-weight: 700;
  }

  .todo-text {
    flex: 1;
    font-size: 14px;
    color: var(--text);
    word-break: break-word;
  }

  .todo-item.done .todo-text {
    text-decoration: line-through;
    color: var(--done);
  }

  .delete-btn {
    border: none;
    background: transparent;
    color: var(--text-soft);
    font-size: 16px;
    cursor: pointer;
    flex-shrink: 0;
    padding: 4px;
    border-radius: 8px;
  }

  .delete-btn:hover { background: var(--baby-blue); color: #234; }

  .empty-state {
    text-align: center;
    color: var(--text-soft);
    font-size: 13px;
    padding: 30px 10px;
  }

  .progress-track {
    margin-top: 16px;
    height: 8px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--baby-blue-dark), var(--pink-deep));
    width: 0%;
    transition: width 0.25s ease;
  }
</style>
</head>
<body>

<div class="widget">
  <div class="timer-panel">
    <h2>Focus Timer</h2>
    <div class="timer-ring">
      <svg width="150" height="150">
        <circle cx="75" cy="75" r="66" stroke="#f0eef2" stroke-width="10" fill="none"></circle>
        <circle id="ringProgress" cx="75" cy="75" r="66" stroke="#ff6f9c" stroke-width="10" fill="none"
                stroke-linecap="round" stroke-dasharray="414.7" stroke-dashoffset="0"></circle>
      </svg>
      <div class="timer-display" id="timerDisplay">25:00</div>
    </div>
    <div class="timer-controls">
      <button id="startPauseBtn" class="primary">Start</button>
      <button id="resetBtn">Reset</button>
    </div>
    <div class="timer-presets">
      <button data-min="5">5m</button>
      <button data-min="15">15m</button>
      <button data-min="25" class="active">25m</button>
      <button data-min="45">45m</button>
    </div>
  </div>

  <div class="todo-panel">
    <div class="todo-header">
      <h1>Today's Checklist</h1>
      <span class="todo-count" id="todoCount">0/0</span>
    </div>
    <div class="todo-sub">Stay on task while the timer runs 🩷</div>

    <div class="add-row">
      <input type="text" id="taskInput" placeholder="Add a task..." maxlength="140">
      <button id="addBtn">+</button>
    </div>

    <ul class="todo-list" id="todoList"></ul>

    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>
</div>

<script>
  // ---------- Todo / checklist logic ----------
  const STORAGE_KEY = 'dailystack_widget_todos';
  const todoList = document.getElementById('todoList');
  const taskInput = document.getElementById('taskInput');
  const addBtn = document.getElementById('addBtn');
  const todoCount = document.getElementById('todoCount');
  const progressFill = document.getElementById('progressFill');

  let todos = loadTodos();

  function loadTodos() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function saveTodos() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    } catch (e) { /* storage unavailable */ }
  }

  function renderTodos() {
    todoList.innerHTML = '';

    if (todos.length === 0) {
      const empty = document.createElement('li');
      empty.className = 'empty-state';
      empty.textContent = 'No tasks yet — add your first one above.';
      todoList.appendChild(empty);
    }

    todos.forEach(todo => {
      const li = document.createElement('li');
      li.className = 'todo-item' + (todo.done ? ' done' : '');

      const checkbox = document.createElement('div');
      checkbox.className = 'checkbox' + (todo.done ? ' checked' : '');
      checkbox.addEventListener('click', () => toggleTodo(todo.id));

      const text = document.createElement('span');
      text.className = 'todo-text';
      text.textContent = todo.text;

      const del = document.createElement('button');
      del.className = 'delete-btn';
      del.textContent = '✕';
      del.addEventListener('click', () => deleteTodo(todo.id));

      li.appendChild(checkbox);
      li.appendChild(text);
      li.appendChild(del);
      todoList.appendChild(li);
    });

    const doneCount = todos.filter(t => t.done).length;
    todoCount.textContent = `${doneCount}/${todos.length}`;
    progressFill.style.width = todos.length ? `${(doneCount / todos.length) * 100}%` : '0%';
  }

  function addTodo() {
    const value = taskInput.value.trim();
    if (!value) return;
    todos.push({ id: Date.now(), text: value, done: false });
    taskInput.value = '';
    saveTodos();
    renderTodos();
  }

  function toggleTodo(id) {
    const todo = todos.find(t => t.id === id);
    if (todo) todo.done = !todo.done;
    saveTodos();
    renderTodos();
  }

  function deleteTodo(id) {
    todos = todos.filter(t => t.id !== id);
    saveTodos();
    renderTodos();
  }

  addBtn.addEventListener('click', addTodo);
  taskInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') addTodo();
  });

  renderTodos();

  // ---------- Timer logic ----------
  const timerDisplay = document.getElementById('timerDisplay');
  const startPauseBtn = document.getElementById('startPauseBtn');
  const resetBtn = document.getElementById('resetBtn');
  const ringProgress = document.getElementById('ringProgress');
  const presetButtons = document.querySelectorAll('.timer-presets button');
  const CIRCUMFERENCE = 2 * Math.PI * 66;

  let totalSeconds = 25 * 60;
  let remainingSeconds = totalSeconds;
  let intervalId = null;
  let isRunning = false;

  function formatTime(seconds) {
    const m = Math.floor(seconds / 60).toString().padStart(2, '0');
    const s = Math.floor(seconds % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  function updateDisplay() {
    timerDisplay.textContent = formatTime(remainingSeconds);
    const fraction = remainingSeconds / totalSeconds;
    ringProgress.style.strokeDashoffset = CIRCUMFERENCE * (1 - fraction);
  }

  function tick() {
    if (remainingSeconds > 0) {
      remainingSeconds--;
      updateDisplay();
    } else {
      pauseTimer();
      timerDisplay.textContent = "Done!";
    }
  }

  function startTimer() {
    if (isRunning) return;
    isRunning = true;
    startPauseBtn.textContent = 'Pause';
    intervalId = setInterval(tick, 1000);
  }

  function pauseTimer() {
    isRunning = false;
    startPauseBtn.textContent = 'Start';
    clearInterval(intervalId);
  }

  function resetTimer() {
    pauseTimer();
    remainingSeconds = totalSeconds;
    updateDisplay();
  }

  startPauseBtn.addEventListener('click', () => {
    isRunning ? pauseTimer() : startTimer();
  });

  resetBtn.addEventListener('click', resetTimer);

  presetButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      presetButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      totalSeconds = parseInt(btn.dataset.min, 10) * 60;
      resetTimer();
    });
  });

  ringProgress.style.strokeDasharray = CIRCUMFERENCE;
  updateDisplay();
</script>

</body>
</html>
